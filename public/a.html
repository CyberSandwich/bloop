<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <script type="module" src="/js/phone.js"></script>

  <body class="page-phone">
    <a class="skip" href="#title">Skip to Content</a>
    <header class="bar">
      <a class="framed" id="back" href="/"><svg class="icon dir" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back</a>
    </header>
    <main id="main" class="column">
      <noscript><p class="nojs">Approving needs JavaScript. Turn it on, then scan again.</p></noscript>
      <div class="flow" id="flow">
        <h1 class="title" id="title" tabindex="-1" hidden>Approve on bloop</h1>
        <div class="skel skel-title" id="skel-title" hidden></div>
        <p class="sub" id="room-sub" hidden>Registered screen</p>
        <p class="body" id="body"></p>
        <p class="ends" id="ends" hidden></p>

        <input class="sr" id="file-pick" type="file" tabindex="-1" aria-label="Choose a File" accept="image/jpeg,image/png,video/mp4,video/quicktime,.jpg,.jpeg,.png,.mp4,.mov,.pdf,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation">
      </div>
      <ul class="list" id="file-list" aria-label="Items" hidden></ul>
      <p class="scope" id="scope" hidden></p>
      <div class="actions glass">
        <div class="buttons" id="actions"></div>
      </div>
      <p class="sr" id="polite" role="status"></p>
    </main>
    <div class="drop-hint" id="drop-hint" aria-hidden="true" hidden>Drop a File to Send It</div>
