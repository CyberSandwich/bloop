<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">
    <title>bloop: Approve</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/phone.js"></script>
  </head>
  <body class="page-phone">
    <a class="skip" href="#title">Skip to Content</a>
    <header class="bar">
      <a class="framed" id="back" href="/"><svg class="icon dir" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back</a>
    </header>
    <main id="main" class="column">
      <noscript><p class="nojs">Approving needs JavaScript. Turn it on, then scan again.</p></noscript>
      <div class="flow" id="flow">
        <h1 class="title" id="title" tabindex="-1" hidden>Approve on bloop</h1>
        <div class="skel skel-title" id="skel-title" hidden></div>
        <p class="sub" id="room-sub" hidden>Registered screen</p>
        <p class="body" id="body"></p>
        <button class="ends" id="ends" type="button" aria-haspopup="dialog" hidden><span id="ends-text"></span><span class="sr">. Change the Session Length</span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></button>
        <p class="warn" id="warn" hidden>
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <span id="warn-text"></span>
        </p>
        <input class="sr" id="file-pick" type="file" tabindex="-1" aria-label="Choose a File" accept="image/jpeg,image/png,video/mp4,video/quicktime,.jpg,.jpeg,.png,.mp4,.mov,.pdf,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation">
      </div>
      <ul class="list" id="file-list" aria-label="Items" hidden></ul>
      <p class="scope" id="scope" hidden></p>
      <div class="actions glass">
        <div class="buttons" id="actions"></div>
      </div>
      <p class="sr" id="polite" role="status"></p>
    </main>
    <div class="drop-hint" id="drop-hint" aria-hidden="true" hidden>Drop a File to Send It</div>
    <dialog class="sheet glass" id="length" aria-labelledby="length-h">
      <div class="sheet-in">
        <div class="sheet-head">
          <h2 id="length-h">Session Length</h2>
          <form method="dialog"><button class="close" type="submit" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></form>
        </div>
        <fieldset class="chips">
          <legend class="sr">End the Session In</legend>
          <button class="btn secondary" type="button" data-minutes="30" aria-label="30 minutes">30m</button>
          <button class="btn secondary" type="button" data-minutes="60" aria-label="1 hour">1h</button>
          <button class="btn secondary" type="button" data-minutes="120" aria-label="2 hours">2h</button>
          <button class="btn secondary" type="button" data-minutes="240" aria-label="4 hours">4h</button>
          <button class="btn secondary" type="button" data-minutes="720" aria-label="12 hours">12h</button>
        </fieldset>
        <form class="until">
          <label for="length-at">Until…</label>
          <input class="field" id="length-at" type="time" required>
          <button class="btn primary" type="submit">Set</button>
        </form>
      </div>
    </dialog>
  </body>
</html>
