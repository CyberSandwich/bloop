<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">
    <title>bloop: Approve</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/phone.js"></script>
  </head>
  <body class="page-phone">
    <a class="skip" href="#title">Skip to Content</a>
    <header class="bar">
      <a class="framed" id="back" href="/"><svg class="icon dir" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back</a>
    </header>
    <main id="main" class="column">
      <noscript><p class="nojs">Approving needs JavaScript. Turn it on, then scan again.</p></noscript>
      <div class="flow" id="flow">
        <h1 class="title" id="title" tabindex="-1" hidden>Approve on bloop</h1>
        <div class="skel skel-title" id="skel-title" hidden></div>
        <p class="sub" id="room-sub" hidden>Registered room</p>
        <p class="body" id="body"></p>
        <button class="ends" id="ends" type="button" aria-haspopup="dialog" hidden><span id="ends-text"></span><span class="sr">. Change the Session Expiry</span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></button>
        <p class="warn" id="warn" hidden>
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <span id="warn-text"></span>
        </p>
        <input class="sr" id="file-pick" type="file" tabindex="-1" aria-label="Choose a File" accept="image/jpeg,image/png,video/mp4,video/quicktime,.jpg,.jpeg,.png,.mp4,.mov,.pdf,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation">
      </div>
      <ul class="list" id="file-list" aria-label="Items" hidden></ul>
      <p class="scope" id="scope" hidden></p>
      <div class="actions glass">
        <div class="buttons" id="actions"></div>
      </div>
      <p class="sr" id="polite" role="status"></p>
    </main>
    <div class="drop-hint" id="drop-hint" aria-hidden="true" hidden>Drop a File to Send It</div>
    <dialog class="leave glass glass-pane" id="revoke" aria-labelledby="revoke-q">
      <h2 id="revoke-q">End This Session?</h2>
      <form class="buttons" method="dialog">
        <button type="submit" class="btn secondary" autofocus>Cancel</button>
        <button type="submit" class="btn rose" id="revoke-end">End Session</button>
      </form>
    </dialog>
    <template id="remote-parts">
      <div class="preview" role="img"><span class="count"></span></div>
      <p class="scope" data-note>Tap the screen once for sound.</p>
      <fieldset class="bubbles">
        <legend class="sr">The Screen</legend>
        <button type="button" class="btn secondary bubble" data-step="-1" aria-label="Previous"><svg class="icon dir" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></button>
        <button type="button" class="btn secondary bubble" data-play aria-label="Play" aria-pressed="true" hidden><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></button>
        <button type="button" class="btn secondary" data-present>Present</button>
        <button type="button" class="btn secondary bubble" data-sound aria-label="Sound" aria-pressed="true" hidden><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg></button>
        <button type="button" class="btn secondary bubble" data-step="1" aria-label="Next"><svg class="icon dir" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></button>
      </fieldset>
    </template>
    <dialog class="sheet" id="length" aria-labelledby="length-h">
      <form class="until glass glass-pane">
        <div class="sheet-card">
          <h2 id="length-h" tabindex="-1">Session Expiry</h2>
          <label class="sr" for="length-at">Expires At</label>
          <input class="field" id="length-at" type="time" required aria-describedby="length-hint">
          <p class="sheet-hint" id="length-hint" hidden></p>
        </div>
        <button class="sheet-x" type="button" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        <fieldset class="chips">
          <legend class="sr">End the Session In</legend>
          <button type="button" data-minutes="30" aria-label="30 minutes">30m</button>
          <button type="button" data-minutes="60" aria-label="1 hour">1h</button>
          <button type="button" data-minutes="120" aria-label="2 hours">2h</button>
        </fieldset>
        <button class="btn primary" type="submit" aria-describedby="length-hint">Set</button>
      </form>
    </dialog>
  </body>
</html>
