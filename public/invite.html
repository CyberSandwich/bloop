<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">
    <title>bloop: Your Invite</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script type="module" src="/js/invite.js"></script>
  </head>
  <body class="page-phone page-auth">
    <a class="skip" href="#title">Skip to Content</a>
    <header class="bar">
      <a class="framed" id="back" href="/"><svg class="icon dir" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back</a>
    </header>
    <main id="main" class="column">
      <noscript><p class="nojs">Accepting an invite needs JavaScript. Turn it on, then open the link again.</p></noscript>
      <div class="flow">
        <div class="skel skel-title" id="skel-title"></div>
        <h1 class="title" id="title" tabindex="-1" hidden>You're Invited</h1>
        <p class="body" id="lead"></p>
        <p class="body" id="about" hidden><b class="name">bloop</b> puts your files on the room screen from your phone. The screen never gets your account.</p>
        <p class="body" id="until" hidden></p>
        <div class="auth-form" id="code-form" hidden>
          <label class="field-label" for="code">Code</label>
          <input class="field" id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="one-time-code" autocorrect="off" spellcheck="false" aria-describedby="code-hint code-error">
          <div class="say">
            <p class="hint" id="code-hint" role="status"><span class="spinner" aria-hidden="true"></span><span id="code-hint-text"></span></p>
            <p class="field-error" id="code-error" role="alert">
              <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
              <span id="code-error-text"></span>
            </p>
          </div>
        </div>
      </div>
      <div class="actions glass">
        <p class="consent" id="adult" hidden>By continuing you confirm you are 18 or over and accept the <a href="/terms" id="terms">Terms</a>.</p>
        <div class="buttons">
          <a class="btn text" id="to-library" href="/library" hidden>Go to Your Library</a>
          <button type="button" class="btn primary" id="accept" hidden><span class="spinner" aria-hidden="true" hidden></span><span id="accept-text">Accept Invite</span></button>
          <button type="button" class="btn primary" id="sign-out" hidden>Sign Out and Continue</button>
          <a class="btn primary" id="home" href="/" hidden>Go to the Home Page</a>
          <a class="btn primary" id="to-signin" href="/signin" hidden>Sign In</a>
          <button type="button" class="btn primary" id="retry" hidden>Try Again</button>
          <button type="button" class="btn text" id="resend" hidden>Send a New Code</button>
        </div>
      </div>
    </main>
  </body>
</html>
