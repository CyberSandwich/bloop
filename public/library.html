<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">
    <title>bloop: Library</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/library.css">
    <script type="module" src="/js/library.js"></script>
  </head>
  <body class="page-library is-loading">
    <a class="skip" href="#title">Skip to Content</a>
    <header class="bar">
      <a class="framed" id="b-home" href="/"><img src="/favicon.svg" width="32" height="32" alt="">bloop</a>
      <a class="framed square" id="b-account" href="/account"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg><span class="sr">Account</span></a>
    </header>
    <main id="main" class="lib">
      <noscript><p class="nojs">Your library needs JavaScript. Turn it on, then reload the page.</p></noscript>
      <div class="lib-head">
        <button class="btn text lib-back" id="back" type="button" hidden><svg class="icon dir" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg>Back</button>
        <div class="lib-titles">
          <h1 class="title" id="title" tabindex="-1">Library</h1>
          <button class="btn text lib-danger" id="empty-trash" type="button" hidden>Empty Trash</button>
        </div>
        <p class="lib-quota" id="quota"></p>
        <!-- [html-validate-disable-next prefer-native-element: two parts, used and reserved, which a progress element cannot draw] -->
        <div class="lib-bar" id="bar" role="progressbar" aria-label="Storage used"><span class="lib-used" id="bar-used"></span><span class="lib-reserved" id="bar-reserved"></span></div>
        <p class="lib-note" id="note" role="status"></p>
      </div>
      <div class="lib-card" id="card" hidden>
        <h2 id="card-title" tabindex="-1">Your Library Didn't Load</h2>
        <p id="card-line"></p>
        <button class="btn primary" id="card-action" type="button"></button>
      </div>
      <section class="lib-empty" id="empty" aria-labelledby="empty-title" hidden>
        <span class="lib-tile glass"><svg class="icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg></span>
        <h2 id="empty-title">Add Your First File</h2>
        <p>Decks, PDFs, documents, spreadsheets, photos and videos. Files stay yours: stored in the EU, deleted when you say.</p>
      </section>
      <section class="lib-up" id="up" aria-labelledby="up-title">
        <div class="lib-group">
          <h2 id="up-title">Up Next</h2>
          <button class="btn text" id="clear" type="button">Clear</button>
        </div>
        <ol class="list lib-list" id="up-list"></ol>
        <p class="lib-first" id="first"></p>
        <button class="btn primary lib-present" id="present-card" type="button" aria-haspopup="dialog">Present</button>
      </section>
      <section class="lib-files" id="files" aria-labelledby="files-title">
        <div class="lib-group">
          <h2 id="files-title">All Files</h2>
          <button class="btn text" id="sort" type="button" aria-haspopup="dialog"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>Sort</button>
        </div>
        <ul class="list lib-list" id="file-list"><li class="skel"></li><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
        <button class="btn text lib-trash-link" id="trash-link" type="button" hidden></button>
      </section>
      <section class="lib-trash" id="trash-view" aria-labelledby="title" hidden></section>
      <div class="lib-panel glass" id="panel">
        <button class="btn secondary" id="sample" type="button" hidden>Add the Sample Deck</button>
        <button class="btn secondary" id="add" type="button">Add Files</button>
        <button class="btn primary" id="present" type="button" aria-haspopup="dialog" disabled>Present</button>
      </div>
      <p class="sr" id="polite" role="status"></p>
      <input class="sr" id="pick" type="file" tabindex="-1" aria-label="Choose Files" multiple>
    </main>
    <div class="drop-hint" id="drop-hint" aria-hidden="true" hidden>Drop Files to Add Them</div>
  </body>
</html>
