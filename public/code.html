<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">
    <title>bloop: Enter the Code</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/code.js"></script>
  </head>
  <body>
    <a class="skip" href="#title">Skip to Content</a>
    <header class="bar">
      <a class="framed" href="/"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.25 6.75 4.75 12l5.5 5.25"/><path d="M19.25 12H5"/></svg>Back</a>
    </header>
    <main id="main" class="column">
      <noscript><p class="nojs">Entering a code needs JavaScript. Turn it on, then try again.</p></noscript>
      <h1 class="title" id="title" tabindex="-1">Enter the Code</h1>
      <form class="code-form" id="code-form" novalidate>
        <label class="field-label" for="code">Code</label>
        <input class="field" id="code" name="code" type="text" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" autocorrect="off" spellcheck="false" maxlength="8" aria-describedby="code-error">
        <p class="field-error" id="code-error">
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.95 16.35 10.22 5.86c.73-1.47 2.84-1.47 3.57 0l5.26 10.5c.67 1.33-.3 2.9-1.79 2.9H6.74c-1.49 0-2.46-1.57-1.79-2.9Z"/><path d="M12 10v2"/><path d="M12 16h.01"/></svg>
          <span id="code-error-text"></span>
        </p>
        <div class="actions">
          <button type="submit" class="btn primary" id="go" disabled>Continue</button>
        </div>
      </form>
    </main>
  </body>
</html>
