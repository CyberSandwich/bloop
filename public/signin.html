<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">
    <title>bloop: Sign In</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script type="module" src="/js/signin.js"></script>
  </head>
  <body class="page-phone page-auth">
    <a class="skip" href="#title">Skip to Content</a>
    <header class="bar">
      <a class="framed" id="back" href="/"><svg class="icon dir" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back</a>
    </header>
    <main id="main" class="column">
      <noscript><p class="nojs">Signing in needs JavaScript. Turn it on, then try again.</p></noscript>
      <div class="flow">
        <h1 class="title" id="title" tabindex="-1">Sign In</h1>
        <p class="body" id="lead">Early access is by invite. Use the email your invite went to.</p>
        <form class="auth-form" id="email-form" novalidate>
          <label class="field-label" for="email">Email</label>
          <input class="field email" id="email" name="email" type="email" required maxlength="254" autocomplete="username webauthn" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-describedby="lead email-error">
          <div class="say">
            <p class="hint" id="email-hint" role="status"><span class="spinner" aria-hidden="true"></span><span id="email-hint-text"></span></p>
            <p class="field-error" id="email-error" role="alert">
              <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
              <span id="email-error-text"></span>
            </p>
          </div>
          <button type="button" class="btn text" id="ts-retry" hidden>Try Again</button>
        </form>
        <div class="auth-form" id="code-form" hidden>
          <label class="field-label" for="code">Code</label>
          <input class="field" id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="one-time-code" autocorrect="off" spellcheck="false" aria-describedby="code-hint code-error">
          <div class="say">
            <p class="hint" id="code-hint" role="status"><span class="spinner" aria-hidden="true"></span><span id="code-hint-text"></span></p>
            <p class="field-error" id="code-error" role="alert">
              <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
              <span id="code-error-text"></span>
            </p>
          </div>
          <button type="button" class="btn text" id="other">Use a Different Email</button>
        </div>
        <div class="ts-box" id="ts-box"></div>
      </div>
      <div class="actions glass">
        <div class="buttons">
          <button type="submit" class="btn primary" id="send" form="email-form" disabled><span class="spinner" aria-hidden="true" hidden></span><span id="send-text">Email Me a Code</span></button>
          <button type="button" class="btn text" id="resend" hidden>Send a New Code</button>
        </div>
      </div>
      <p class="waitlist" id="waitlist">No invite? <a href="https://tally.so/r/Yj4KAN?source=signin" data-waitlist>Join the waitlist</a>.</p>
    </main>
  </body>
</html>
