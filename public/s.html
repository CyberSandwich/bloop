<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light">
    <title>bloop screen</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/screen.js"></script>
  </head>
  <body class="page-screen">
    <a class="skip" href="#main">Skip to Content</a>
    <header class="bar">
      <a class="round" id="b-back" href="/"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span class="sr">Home</span></a>
      <button type="button" class="round" id="b-start-over" aria-label="Start Over" hidden><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <button type="button" class="brand" id="b-home" aria-label="bloop, End and Go Home" hidden><img src="/favicon.svg" width="28" height="28" alt="">bloop</button>
      <a class="btn secondary" id="b-here" href="/a" hidden>Approve on This Device</a>
      <button type="button" class="btn secondary" id="b-end" hidden>End</button>
    </header>
    <main id="main">
      <noscript><p class="nojs">This screen needs JavaScript to show a code.</p></noscript>
      <div class="narrow">
        <p class="narrow-title">Open this on the room's screen.</p>
        <p class="line">Then scan its code with your phone.</p>
        <a class="btn secondary" href="/code">Enter a Code</a>
      </div>
      <div class="side glass" id="side" popover hidden>
        <ul class="items" id="items" aria-label="Items"></ul>
      </div>
      <div class="pane" id="pane">
        <button type="button" class="handle glass" id="handle" popovertarget="side" hidden></button>
        <div id="stage" role="status" aria-live="polite">
          <h1 id="heading" tabindex="-1">bloop screen</h1>
          <p class="line" id="line"></p>
        </div>
        <div class="qr-card" id="qr-panel">
          <svg id="qr" role="img" aria-label="QR code. Scan it with your phone camera to open bloop." viewBox="0 0 41 41" width="205" height="205" shape-rendering="crispEdges" focusable="false"><rect width="41" height="41" fill="#FFFFFF"/><path id="qr-path" fill="#1D1D1F" d=""/></svg>
          <p class="match" id="match" hidden></p>
          <div class="drain" aria-hidden="true"><span id="drain"></span></div>
        </div>
        <p class="code-card"><span class="code" id="typed-code"></span></p>
        <p class="hint" id="hint">Scan with your phone, or enter the code at <span id="typed-host"></span>/code</p>
        <div class="frame" id="frame" hidden></div>
        <div class="pager" id="pager" hidden>
          <button type="button" class="round glass" id="prev" aria-label="Previous page"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></button>
          <span class="dots" id="dots" aria-hidden="true"></span>
          <button type="button" class="round glass" id="next" aria-label="Next page"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div class="actions-row" id="controls">
          <button type="button" class="btn primary" id="b-present" hidden>Present</button>
          <button type="button" class="btn primary" id="b-open" hidden>Open</button>
          <button type="button" class="btn secondary" id="b-download" hidden>Download</button>
          <button type="button" class="btn text" id="b-pdf" hidden>Show as PDF Instead</button>
        </div>
      </div>
    </main>
    <p class="foot">Phone not with you? Sign in to this PC as usual.</p>
  </body>
</html>
