name: staging

# A push to the `staging` branch deploys that commit to the bloop-staging Worker (docs/setup.md, Staging). No other
# branch runs these jobs: the deploy job holds a Cloudflare token, and the `staging` environment allows that branch only.
# It skips with a log line until the staging D1 and the environment's secrets exist; a bad token or an outage fails it.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  # Third-party code runs here (install, tests, the build) and the job has no environment, so no token.
  check:
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node tools/prebuilt.mjs manifest
      # Dotfiles (.assetsignore, .well-known/) are part of dist/; the deploy job checks the manifest.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  # Only the lockfile's wrangler runs with the token: a fresh install with no scripts, the built dist/ from the check
  # job, and no build of its own.
  staging:
    if: github.ref_name == 'staging'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      # A secret cannot be tested in an `if`, so this step reads it and reports whether it exists.
      - name: Check for Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "Staging skipped: no CLOUDFLARE_API_TOKEN in the staging environment."; fi
      - if: steps.gate.outputs.has == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.has == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.gate.outputs.has == 'true'
        run: npm ci --ignore-scripts
      - if: steps.gate.outputs.has == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Look for the staging resources
        id: resources
        if: steps.gate.outputs.has == 'true'
        run: node tools/staging.mjs ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: steps.resources.outputs.ready == 'true'
        run: node tools/staging.mjs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ steps.resources.outputs.d1_id }}
