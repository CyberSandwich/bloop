name: staging

# A push to the `staging` branch deploys that commit to the bloop-staging Worker (docs/setup.md, Staging). No other
# branch runs this job: it holds a Cloudflare token, and the `staging` environment allows that branch only. It skips
# with a log line until the staging D1 and the environment's secrets exist, so it never fails the repo.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      # As in deploy.yml: a secret cannot be tested in an `if`, and the token is set on the wrangler steps alone.
      - name: Check for Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "Staging skipped: no CLOUDFLARE_API_TOKEN in the staging environment."; fi
      - if: steps.gate.outputs.has == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.has == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install script runs in a job that will hold the token; tools/staging.mjs runs the lockfile's wrangler by path.
      - if: steps.gate.outputs.has == 'true'
        run: npm ci --ignore-scripts
      - if: steps.gate.outputs.has == 'true'
        run: npm run check
      - name: Look for the staging resources
        id: resources
        if: steps.gate.outputs.has == 'true'
        run: node tools/staging.mjs ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: steps.resources.outputs.ready == 'true'
        run: node tools/staging.mjs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ steps.resources.outputs.d1_id }}
