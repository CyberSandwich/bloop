name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Secrets cannot be tested in a job-level `if`, so every step gates on this env check.
      - name: Skip without Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "No CLOUDFLARE_API_TOKEN; skipping deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run check
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply DB --remote
      # The 1-day backstop for guest files (ADR 0005); wrangler.jsonc cannot express it.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler r2 bucket lifecycle set bloop-guest-files --file tools/r2-lifecycle.json --jurisdiction eu --force
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
