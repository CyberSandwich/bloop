name: container

# What this does, and what it needs: container/README.md, "CI and publishing".

on:
  push:
    paths:
      - "container/**"
      - "!container/digest.txt"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "container/**"
      - "!container/digest.txt"
      - ".github/workflows/container.yml"
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue instead of cancelling, so a publish is never cut off between its push and its prune.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: bloop-converter:ci

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Image pruning script tests
        run: node --test container/test/prune.test.mjs
      - name: Go unit tests
        run: docker build --target test container
      - name: Build the image
        run: docker build --tag "$IMAGE" container
      - name: Generate the fixtures
        run: node container/fixtures/make.mjs
      - name: Run the corpus
        run: node container/test/corpus.mjs
      - name: Image size
        run: docker image ls "$IMAGE" --format 'image {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - name: Keep the tested image for publishing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: converter-image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # pruning reads digest.txt's history on origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the repo's wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: converter-image
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: gzip -dc "$RUNNER_TEMP/image.tar.gz" | docker load

      # The token is set on the steps that need it, never on the job (SITE-05).
      - name: Push to the Cloudflare registry
        id: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing from the production environment"
            exit 1
          fi
          tag="sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$IMAGE" "bloop-converter:${tag}"
          npx --no-install wrangler containers push "bloop-converter:${tag}"
          remote="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/bloop-converter:${tag}"
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$remote" | grep -o 'sha256:[0-9a-f]\{64\}' | head -n1)"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "pushed bloop-converter:${tag} as ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The commit message and PR title name the tag: prune-images.mjs reads it back from origin/main.
      - name: Open a PR that bumps the digest
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ steps.push.outputs.tag }}
        run: |
          set -euo pipefail
          branch="container-digest-${GITHUB_SHA::12}"
          echo "$DIGEST" > container/digest.txt
          git add container/digest.txt
          if git diff --cached --quiet; then echo "digest unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Converter image ${TAG}: bump digest to ${DIGEST}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=Authorization: Basic ${auth}" push --force origin "$branch"
          title="Converter image ${TAG}: bump digest"
          body="Pushed by container.yml after the corpus passed on this build (${DIGEST}). Checks do not run on a pull request opened with GITHUB_TOKEN; the main run that built this image is the test, so merge on that. Close it unmerged and the image is pruned by a later publish."
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$branch" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body" \
              || { echo "::error::The digest ${DIGEST} (${TAG}) is pushed but not pinned: GitHub Actions cannot create the PR. Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests, then open a PR from ${branch}."; exit 1; }
          fi

      # Runs even when the bump failed: the image just pushed is always kept, so a failed bump loses nothing.
      - name: Prune old images
        if: always() && steps.push.outputs.digest != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.push.outputs.tag }}
        run: node container/prune-images.mjs "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" "$TAG"
