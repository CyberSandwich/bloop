name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same steps as `npm run check`, one per step so a failure names its check.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:int
      - run: npm run html-validate
      # On failure, each result becomes an annotation (readable without the job log).
      - run: npm run size || { npx size-limit --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const l of s.slice(0,4000).split("\n"))console.log("::error title=size::"+l)})'; exit 1; }

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The pairing routes fail closed without the fake secrets.
      - run: cp .dev.vars.example .dev.vars
      # Playwright starts `npm run dev` itself (playwright.config.ts); the axe specs run inside it.
      - run: npm run test:e2e
      # Lighthouse CI starts its own `npm run dev` and asserts the budgets in lighthouserc.json.
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
