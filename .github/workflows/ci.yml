name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same steps as `npm run check`, one per step so a failure names its check.
      # The page build is a gate, never a commit: rebuilding must change nothing and add nothing.
      - run: npm run build:pages
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:int
      - run: npm run html-validate
      # On failure, each result becomes an annotation (readable without the job log).
      - run: npm run size || { npx size-limit --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let r;try{r=JSON.parse(s)}catch{r=[{name:s.slice(0,500)}]}for(const e of [].concat(r))console.log("::error title=size::"+[e.name,e.size,e.sizeLimit,e.passed].join(" "))})'; exit 1; }

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The pairing routes fail closed without the fake secrets.
      - run: cp .dev.vars.example .dev.vars
      # Playwright starts `npm run dev` itself (playwright.config.ts); the axe specs run inside it.
      # The screenshot tour (test/e2e/shots.spec.ts) runs only on throwaway `*-shots` branches.
      - run: npm run test:e2e
        env:
          TOUR: ${{ contains(github.ref_name, '-shots') && '1' || '' }}
      # Lighthouse CI starts its own `npm run dev` and asserts the budgets in lighthouserc.json.
      - run: npx lhci autorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
