name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: echo "CHECK_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The size ratchet reads the budgets at the merge-base with main, or at the push's previous tip.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts, as in deploy.yml's check: deploy may ship this job's dist/ (ADR 0031).
      - run: npm ci --ignore-scripts
      # A size-limit budget only holds or drops (design.md); a raised one fails here, naming it.
      - run: node tools/size-ratchet.mjs
        env:
          BEFORE: ${{ github.event.before }}
      # The same steps as `npm run check`, one per step so a failure names its check.
      # The page build is a gate, never a commit: rebuilding must change nothing and add nothing.
      - run: npm run build:pages
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
      - run: npm run build:assets
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:int
      - run: npm run html-validate
      # On failure, each result becomes an annotation (readable without the job log).
      - run: npm run size || { npx size-limit --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let r;try{r=JSON.parse(s)}catch{r=[{name:s.slice(0,500)}]}for(const e of [].concat(r))console.log("::error title=size::"+[e.name,e.size,e.sizeLimit,e.passed].join(" "))})'; exit 1; }
      # The rehearsal job takes this dist/ the way a deploy job does.
      - run: node tools/prebuilt.mjs manifest
      # deploy.yml's reuse job reads this line from this job's own log, which no other job can write (ADR 0031).
      - name: Manifest digest for deploy reuse
        run: node tools/ci-reuse.mjs digest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # A warning well before the timeout above cancels the job; the 25 must match its timeout-minutes.
      - if: always()
        run: |
          used=$(( $(date +%s) - CHECK_START ))
          if [ "$used" -gt $(( 25 * 60 * 7 / 10 )) ]; then echo "::warning title=check time::the check job took ${used}s, past 70% of its timeout"; fi

  # The deploy flow with no environment and no token, on every branch: the artifact round trip with its hidden files,
  # the build swap and the pinned wrangler, ending in a dry run that uploads nothing. main's first real deploy is not
  # this flow's first run.
  rehearsal:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prebuilt-dist
      - run: node tools/prebuilt.mjs assert
      - run: node tools/pinned-wrangler.mjs deploy --dry-run --outdir "$RUNNER_TEMP/production"
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: node tools/pinned-wrangler.mjs deploy --dry-run -e staging --outdir "$RUNNER_TEMP/staging"
        env:
          WRANGLER_SEND_METRICS: "false"
      # The lockdown workflow's wrangler call (docs/lockdown.md), on the same install: it must start with no token.
      - run: node tools/pinned-wrangler.mjs d1 execute --help
        env:
          WRANGLER_SEND_METRICS: "false"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The pairing routes fail closed without the fake secrets.
      - run: cp .dev.vars.example .dev.vars
      # Playwright starts `npm run dev` itself (playwright.config.ts); the axe specs run inside it.
      - run: npm run test:e2e
      # Lighthouse CI starts its own `npm run dev` and asserts the budgets in lighthouserc.json.
      # collect fails only when Lighthouse cannot record a run (a runtimeError such as NO_NAVSTART), never on a
      # score, so it gets one retry; assert, which judges the page, runs once.
      - run: npx lhci collect || npx lhci collect
      - run: npx lhci assert
      - run: npx lhci upload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
